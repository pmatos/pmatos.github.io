<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">The conductor's workshop</title><desc id="desc">A human at a score desk directs a quiet workshop where small agents work at illuminated benches; one desk remains close for hands-on work.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162835"/><stop offset=".46" stop-color="#274651"/><stop offset="1" stop-color="#293541"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#314d50"/><stop offset=".55" stop-color="#26383f"/><stop offset="1" stop-color="#192632"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#a9dbce" stop-opacity=".22"/><stop offset="1" stop-color="#769da3" stop-opacity=".04"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#f7ca7d" stop-opacity=".68"/><stop offset=".35" stop-color="#edb773" stop-opacity=".23"/><stop offset="1" stop-color="#edb773" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#80d3db" stop-opacity=".58"/><stop offset="1" stop-color="#80d3db" stop-opacity="0"/></radialGradient>
 <linearGradient id="brass" x2="1" y2=".5"><stop stop-color="#80624b"/><stop offset=".5" stop-color="#d6a86e"/><stop offset="1" stop-color="#785a46"/></linearGradient>
 <linearGradient id="paper" x2="1" y2=".8"><stop stop-color="#f2d6a9"/><stop offset="1" stop-color="#be9b75"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".38" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".095"/></feComponentTransfer></filter>
 <g id="bench"><ellipse cx="0" cy="48" rx="90" ry="18" fill="#0c1d28" opacity=".6"/><path d="M-69 2 24-17 78 7-9 29Z" fill="#765b49" stroke="#a48564" stroke-width="3"/><path d="M-57 19-57 62M55 17 55 63" stroke="#5e493c" stroke-width="9"/><path d="M-17-2 21-9 23 13-14 20Z" fill="#9ad2ca" stroke="#87c7c7" stroke-width="2"/><path d="M-12 3 18-2 19 11-11 16Z" fill="#70bec0"/><ellipse cx="4" cy="13" rx="34" ry="11" fill="#64b7bb" opacity=".21"/><path d="M-30 18 10 10 32 16-8 25Z" fill="#b09d82"/><path d="M-55-12q2-26 22-29 22-2 23 19l-3 20-24 7Z" fill="#445d63" stroke="#8fa3a0" stroke-width="3"/><circle cx="-31" cy="-34" r="15" fill="#536c70" stroke="#b5ae90" stroke-width="3"/><circle cx="-35" cy="-37" r="2.5" fill="#e9b985"/><circle cx="-24" cy="-37" r="2.5" fill="#e9b985"/><path d="M-22-10 1 9M-37-8-19 19" fill="none" stroke="#8c9d98" stroke-width="7" stroke-linecap="round"/><path d="M-47 3q-18 21-11 51M-17 9q-2 23 7 50" fill="none" stroke="#394e50" stroke-width="10" stroke-linecap="round"/></g>
</defs>
